name: Set up workspace
description: Install pnpm, Node.js and the locked dependencies of this repository on a GitHub-hosted runner. Run actions/checkout first.

inputs:
  node-version:
    description: Node.js version passed to actions/setup-node.
    default: '24'
  bubblewrap:
    description: "'true' installs the pinned bubblewrap build and unrestricts user namespaces (Linux runners only)."
    default: 'false'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v5.0.0
      with:
        dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

    - uses: actions/setup-node@v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        package-manager-cache: false

    - name: Install (immutable)
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Prepare bubblewrap (unrestrict userns)
      if: inputs.bubblewrap == 'true'
      shell: bash
      run: bash scripts/prepare-ci-bubblewrap.sh
