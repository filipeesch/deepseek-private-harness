name: Private Desktop release

# Builds unsigned Desktop installers on GitHub-hosted runners and publishes them, with the electron-updater
# metadata, to a GitHub Release of this repository. The packaged application reads those releases (the
# `github` update provider) and contacts no other update origin.
#
# Release tag: `v<version>` with exactly the version in apps/desktop/package.json. A version without a
# pre-release suffix (`v0.2.2`) is a normal release served to the stable channel. A version with one
# (`v0.2.3-rc.1`) is published as a pre-release served to the nightly channel.
#
# Triggers:
# - Push to master: releases the current version when its `v<version>` tag does not exist yet, creating the
#   tag at the pushed commit; otherwise does nothing. Merges without a version change never release.
# - Tag push `v*` or manual run with an existing tag: builds and publishes that tag.
#
# Targets: Windows x64 (NSIS, auto-updatable). Linux (AppImage) is not built because the Desktop packaging
# scripts support only macOS and Windows targets; macOS is excluded because this repository has no Apple signing.

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and publish, for example v0.2.2'
        type: string
        required: true

permissions:
  contents: read

# One release run at a time, so two quick merges cannot publish the same version twice.
concurrency:
  group: private-desktop-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release: ${{ steps.release.outputs.release }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      channel: ${{ steps.release.outputs.channel }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ (github.event_name == 'push' && github.ref_type == 'branch') && github.sha || format('refs/tags/{0}', inputs.tag || github.ref_name) }}
      - name: Resolve the tag and Desktop version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          FROM_BRANCH: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/desktop/package.json').version")"
          if [[ "$FROM_BRANCH" == true ]]; then
            tag="v$version"
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              echo "Tag $tag already exists; nothing to release."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            tag="$REQUESTED_TAG"
            if [[ "$tag" != "v$version" ]]; then
              echo "::error::Tag $tag must equal v$version, the version in apps/desktop/package.json"; exit 1
            fi
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $tag must look like v1.2.3 or v1.2.3-rc.1"; exit 1
          fi
          if [[ "$version" == *-* ]]; then prerelease=true; channel=nightly; else prerelease=false; channel=stable; fi
          {
            echo "release=true"
            echo "tag=$tag"
            echo "sha=$(git rev-parse HEAD)"
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "channel=$channel"
          } >> "$GITHUB_OUTPUT"

  build-windows:
    name: Windows x64 installer
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      # Fixed for the life of this distribution: a changed application identifier installs beside, not over, earlier releases.
      DSH_DESKTOP_APP_ID: io.github.filipeesch.deepseek-private-harness
      DSH_DESKTOP_PRIVATE_UPDATE_REPOSITORY: ${{ github.repository }}
      DSH_DESKTOP_UPDATE_CHANNEL: ${{ needs.prepare.outputs.channel }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Enable Developer Mode (symlink support)
        run: >-
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"
      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          exit $LASTEXITCODE
      - name: Write the packaging settings
        # Packaging reads release settings from this file, not from ambient variables.
        run: Set-Content -Path apps/desktop/.env.windows -Value "DSH_DESKTOP_APP_ID=$env:DSH_DESKTOP_APP_ID"
      - name: Check packaging configuration and toolchain
        run: |
          pnpm run package:desktop:win:x64:unsigned --check
          exit $LASTEXITCODE
      - name: Build installer and verify packaged runtime
        run: |
          pnpm run package:desktop:win:x64:unsigned
          exit $LASTEXITCODE
      - name: Verify the embedded update feed
        env:
          ARTIFACTS: apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $feed = Get-Content -Raw "$env:ARTIFACTS/win-unpacked/resources/app-update.yml"
          Write-Host $feed
          if ($feed -notmatch '(?m)^provider: github\s*$') { throw 'app-update.yml does not use the github provider' }
          if ($feed -notmatch "(?m)^owner: $([regex]::Escape($env:GITHUB_REPOSITORY_OWNER))\s*$") { throw 'app-update.yml names another owner' }
          if ($feed -match 'deepseek\.com') { throw 'app-update.yml references a DeepSeek origin' }
          $metadata = Get-Content -Raw "$env:ARTIFACTS/latest.yml"
          if ($metadata -notmatch "(?m)^version: $([regex]::Escape($env:VERSION))\s*$") { throw 'latest.yml does not declare the release version' }
          $installer = @(Get-ChildItem "$env:ARTIFACTS/deepseek-harness-*-win-x64-unsigned.exe")
          if ($installer.Count -ne 1) { throw "Expected exactly one installer, found $($installer.Count)" }
          if (-not (Test-Path "$($installer.FullName).blockmap")) { throw 'The installer has no blockmap' }
      - name: Retain release files
        uses: actions/upload-artifact@v7.0.1
        with:
          name: desktop-win-x64
          path: |
            apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/deepseek-harness-*-win-x64-unsigned.exe
            apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/deepseek-harness-*-win-x64-unsigned.exe.blockmap
            apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/latest.yml
          if-no-files-found: error
          retention-days: 14
      - name: Retain packaging diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-package-logs-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: apps/desktop/.desktop-build/packaging-runs/
          if-no-files-found: warn
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [prepare, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-files
      - name: Publish the release
        # The release stays a draft, invisible to updaters, until every file is present. The update
        # metadata uploads last so that no feed ever names a missing installer. A missing tag is created at
        # the built commit when the draft is published; an existing tag keeps its commit.
        run: |
          set -euo pipefail
          ls -l release-files
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            flags=()
            if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
            gh release create "$TAG" --target "$SHA" --draft --title "$TAG" --generate-notes "${flags[@]}"
          fi
          shopt -s nullglob
          binaries=(release-files/deepseek-harness-*.exe release-files/deepseek-harness-*.exe.blockmap)
          metadata=(release-files/latest*.yml)
          if (( ${#binaries[@]} == 0 || ${#metadata[@]} == 0 )); then
            echo "::error::Missing installers or update metadata"; exit 1
          fi
          gh release upload "$TAG" "${binaries[@]}" --clobber
          gh release upload "$TAG" "${metadata[@]}" --clobber
          if [[ "$PRERELEASE" == true ]]; then latest=false; else latest=true; fi
          gh release edit "$TAG" --draft=false --prerelease="$PRERELEASE" --latest="$latest"
